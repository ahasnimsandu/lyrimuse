name: Android APK

on:
  push:
    branches: [main, android-app]
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The preinstalled SDK image varies; use it when present, else fetch the
      # command-line tools. (android-actions/setup-android currently fails on
      # runners because it installs the removed "tools" package.)
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK/cmdline-tools" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/clt.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          echo "SDK packages: $(ls "$SDK/platforms" "$SDK/build-tools")"

      - name: Unit tests (lyric parsers)
        run: |
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          ./tools/test.sh

      - name: Toolchain (apksig)
        run: |
          # The signing key is committed so CI and local builds produce
          # upgrade-compatible APKs (public debug-style key, see README).
          curl -fsSL -o tools/apksig.jar \
            https://maven.aliyun.com/repository/google/com/android/tools/build/apksig/8.5.2/apksig-8.5.2.jar

      - name: Build APK
        run: |
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          export AAPT2="$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2"
          export D8="$ANDROID_SDK_ROOT/build-tools/34.0.0/d8"
          ./tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lyrimuse-apk
          path: Lyriu.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" Lyriu.apk --clobber
