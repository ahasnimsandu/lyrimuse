name: Android APK

on:
  push:
    branches: [main, android-app]
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Toolchain
        run: |
          curl -fsSL -o tools/apksig.jar \
            https://maven.aliyun.com/repository/google/com/android/tools/build/apksig/8.5.2/apksig-8.5.2.jar
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        env:
          ANDROID_JAR: ${{ env.ANDROID_SDK_ROOT }}/platforms/android-34/android.jar
          AAPT2: ${{ env.ANDROID_SDK_ROOT }}/build-tools/34.0.0/aapt2
          D8: ${{ env.ANDROID_SDK_ROOT }}/build-tools/34.0.0/d8
        run: ./tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Lyrimuse-apk
          path: Lyrimuse.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" Lyrimuse.apk --clobber
